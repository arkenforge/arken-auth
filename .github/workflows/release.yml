name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @arkenforge/arken-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/arken-auth
          npm publish --access public 2>&1 | tee /tmp/npm-out.txt || grep -q "cannot publish over" /tmp/npm-out.txt || exit 1

      - name: Publish arken-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/arken-client
          npm publish --access public 2>&1 | tee /tmp/npm-out.txt || grep -q "cannot publish over" /tmp/npm-out.txt || exit 1
