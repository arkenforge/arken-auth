[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arken-client"
version = "0.1.0"
description = "Client SDK for arken-auth — handles the a401 challenge-response flow automatically."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["arken", "did", "did:key", "authentication", "a401", "agent", "secp256k1"]
dependencies = [
    "httpx>=0.25.0",
    "eth-account>=0.10.0",
    "eth-keys>=0.4.0",
    "base58>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage   = "https://github.com/arkenforge/arken-auth"
Repository = "https://github.com/arkenforge/arken-auth"
Issues     = "https://github.com/arkenforge/arken-auth/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["arken_client*"]
